<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blazz Russia | Панель управления</title><meta name="theme-color" content="#0a0f1d"><style>
:root{color-scheme:dark;--bg:#0a0e1a;--surface:#151c30;--stroke:#303b5b;--txt:#f1f3fd;--muted:#9daaca;--purple:#977af3;--sky:#52b6db}*{box-sizing:border-box}body{background:radial-gradient(ellipse at 75% -18%,#34204f 0,transparent 42%),var(--bg);margin:0;font:14px/1.55 system-ui,Arial;color:var(--txt)}button,input,select{font:inherit}button{border:1px solid #575277;border-radius:10px;background:#292847;color:#f7f5ff;padding:10px 14px;cursor:pointer}button:hover{border-color:#b5a2ff}button.main{border:0;background:linear-gradient(110deg,#7750c9,#347cae);font-weight:700}input,select{width:100%;min-width:0;border:1px solid #465375;border-radius:9px;background:#0c1427;color:var(--txt);padding:11px}.muted{color:var(--muted)}.card{background:linear-gradient(135deg,#171f35,#11192b);border:1px solid var(--stroke);border-radius:16px;padding:20px;margin-bottom:16px}.shell{min-height:100vh;display:flex}.sidebar{width:230px;flex:none;background:#0b1020;border-right:1px solid #2b3650;padding:22px 13px;display:flex;flex-direction:column;gap:6px}.logo{font-size:22px;font-weight:850;letter-spacing:.3px;margin:5px 9px 20px}.logo small{display:block;font-size:11px;letter-spacing:2px;color:var(--sky);font-weight:600}.nav{text-align:left;background:transparent;border:0;color:var(--muted);width:100%;border-radius:9px}.nav.selected{color:white;background:#292447;border-left:3px solid #a78afc}.body{flex:1;min-width:0;padding:30px clamp(12px,3.5vw,50px)}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}.top h1{margin:0;font-size:30px}.top select{width:195px}.stats{display:grid;grid-template-columns:repeat(3,minmax(110px,1fr));gap:16px}.stat strong{font-size:30px;color:#c3afff;display:block}.stat span{color:var(--muted)}.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}.form{display:grid;gap:10px;align-content:start}.form h3{margin:0 0 6px}.form label{font-size:13px;color:var(--muted)}.form input,.form select{margin-top:5px}.tablebox{overflow:auto}.table{border-collapse:collapse;width:100%;font-size:12px}.table td,.table th{padding:10px;border-bottom:1px solid #2c3856;text-align:left;max-width:370px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.table th{color:var(--muted)}.login{max-width:490px;margin:10vh auto;padding:30px}.login h1{margin-bottom:8px}.command{display:block;background:#0b1428;border:1px dashed #7366b0;color:#d5c0ff;padding:15px;margin:15px 0;border-radius:10px;text-align:center;font-size:20px;letter-spacing:1px;overflow-wrap:anywhere}.hide{display:none!important}.alert{background:#18223c;border:1px solid #465779;border-radius:11px;padding:13px;margin:12px 0}.error{color:#ff96a6}.success{color:#92e1c2}a{color:#9cc4ff}@media(max-width:790px){.shell{display:block}.sidebar{width:100%;display:flex;flex-direction:row;overflow:auto;align-items:center;padding:8px}.logo{font-size:16px;margin:0 12px;white-space:nowrap}.logo small{display:none}.nav{width:auto;white-space:nowrap;padding:8px}.body{padding:20px 12px}.stats{grid-template-columns:repeat(2,minmax(120px,1fr))}}
</style></head><body><div id="login" class="login card"><div class="logo">BLAZZ RUSSIA<small>CONTROL CENTER</small></div><h1>Вход в панель</h1><p class="muted">Защищённый вход по команде в личных сообщениях ВКонтакте. Не требуется пароль или токен.</p><button id="start" class="main">Получить код входа</button><div id="auth" class="hide"><p>Отправь эту команду <b>в личные сообщения сообществу</b>:</p><strong id="command" class="command"></strong><button id="copy">Скопировать команду</button> <a href="https://vk.com/club242420494" target="_blank" rel="noopener">Открыть VK</a><p id="waiting" class="muted">Ожидаем подтверждение...</p></div><p id="loginerr" class="error"></p></div>
<div id="app" class="shell hide"><aside class="sidebar"><div class="logo">BLAZZ RUSSIA<small>ADMIN PANEL</small></div><button class="nav selected" data-section="overview">Обзор</button><button class="nav" data-section="chats">Беседы</button><button class="nav" data-section="nicks">Никнеймы</button><button class="nav" data-section="roles">Права</button><button class="nav" data-section="factions">Фракции</button><button class="nav" data-section="reports">Жалобы</button><button class="nav" data-section="punishments">Наказания</button><button class="nav" data-section="logs">Журнал</button><button class="nav" data-section="settings">Настройки</button><div style="flex:1"></div><button class="nav" id="logout">Выйти</button></aside><main class="body"><div class="top"><div><h1 id="title">Обзор</h1><span id="me" class="muted">Проверка авторизации</span></div><label>Сервер <select id="server"><option value="1">Сервер №1</option></select></label></div><div id="notice"></div><div id="content"></div></main></div>
<script>
(function(){"use strict";
var root="https://rskgbkgtrigtznnksbyp.supabase.co/functions/v1/blazz-russia-panel",sec="overview",server=1,waitingTimer=null;
var $=s=>document.getElementById(s);
var esc=x=>String(x===null||x===undefined?"":typeof x==="object"?JSON.stringify(x):x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
var api=async(path,options)=>{var t=sessionStorage.getItem("blazz_panel_session"),headers={"Content-Type":"application/json"};if(t)headers.Authorization="Bearer "+t;var r=await fetch(root+"/api/"+path,Object.assign({credentials:"omit",headers},options||{}));var x=await r.json();if(!r.ok)throw Error(x.error||"Ошибка сервера "+r.status);return x;};
var post=(p,data)=>api(p,{method:"POST",body:JSON.stringify(data||{})});
var notice=(x,good)=>{$("notice").innerHTML='<div class="alert '+(good?'success':'error')+'">'+esc(x)+'</div>';};
function field(name,label,p="",optional=false){return '<label>'+esc(label)+'<input name="'+name+'" placeholder="'+esc(p)+'"'+(optional?"":" required")+'></label>'}
function select(name,label,opts){return '<label>'+esc(label)+'<select name="'+name+'">'+opts.map(x=>'<option value="'+esc(x[0])+'">'+esc(x[1])+'</option>').join("")+'</select></label>'}
function form(title,type,fields){return '<form class="card form" data-action="'+type+'"><h3>'+esc(title)+'</h3>'+fields+'<button class="main" type="submit">Сохранить</button></form>'}
function controls(page){
if(page==="nicks")return form("Установить RP-ник","nick",field("vk_id","VK ID игрока","123456789")+field("nickname","RP-ник","Ivan_Ivanov"));
if(page==="roles")return form("Назначить уровень","role",field("vk_id","VK ID игрока")+select("level","Уровень",[[0,"0 — Участник"],[1,"1 — Мл. модератор"],[2,"2 — Модератор"],[3,"3 — Ст. модератор"],[4,"4 — Администратор"],[5,"5 — Главный админ"],[6,"6 — Спецадминистратор"]])+select("scope","Область полномочий",[["server","Сервер"],["chat","Беседа"],["project","Весь проект"]])+field("peer_id","ID беседы (для области «Беседа»)","",true)+field("duration","Срок (если временно)","3d",true))+form("Отдельное разрешение","permission",field("vk_id","VK ID игрока")+select("permission","Разрешение",[["nickname.edit","Никнеймы"],["moderation.warn","Предупреждения"],["moderation.mute","Муты"],["moderation.ban","Баны"],["factions.manage","Фракции"],["reports.manage","Жалобы"],["chat.settings","Настройки бесед"],["panel.access","Доступ к панели"],["logs.view","Просмотр журнала"]])+select("mode","Действие",[["grant","Выдать"],["revoke","Отозвать"]]));
if(page==="factions")return form("Создать фракцию","faction",field("name","Название фракции","МВД"))+form("Управление составом","member",field("faction_id","ID фракции")+field("vk_id","VK ID игрока")+field("rank","Должность","Сержант")+select("status","Назначение",[["member","Участник"],["leader","Лидер"],["deputy","Заместитель"],["remove","Уволить"]]));
if(page==="reports")return form("Закрыть жалобу","report",field("report_id","ID жалобы"));
if(page==="settings")return form("Защита беседы","settings",field("peer_id","ID беседы","2000000001")+select("field","Настройка",[["anti_spam","Антифлуд"],["anti_repeat","Повторы"],["anti_mentions","Массовые упоминания"],["anti_links","Ссылки"],["quiet","Режим тишины"]])+select("value","Состояние",[["true","Включено"],["false","Выключено"]]));
if(page==="chats")return form("Настроить сервер беседы","chat",field("peer_id","ID беседы","2000000001")+field("server_id","Номер сервера","1")+field("chat_type","Тип беседы","general"));+form("Добавить игровой сервер","server",field("server_id","Номер сервера","2")+field("name","Название сервера","Сервер №2"));
if(page==="punishments")return form("Наказание игрока","punish",field("peer_id","ID беседы","2000000001")+field("vk_id","VK ID игрока")+select("kind","Тип наказания",[["warn","Предупреждение"],["mute","Мут"],["ban","Бан"],["kick","Кик"],["gban","Глобальный бан"],["unwarn","Снять предупреждение"],["unmute","Снять мут"],["unban","Снять бан"]])+field("duration","Срок мута","30m",true)+field("reason","Причина","Нарушение правил",true));
return ""}
var heads={overview:"Обзор",chats:"Беседы",nicks:"Никнеймы",roles:"Права",factions:"Фракции",reports:"Жалобы",punishments:"Наказания",logs:"Журнал действий",settings:"Настройки"};
function table(rows){if(!rows.length)return '<div class="card muted">Пока нет записей для этого раздела.</div>';var keys=Object.keys(rows[0]);return '<div class="card tablebox"><table class="table"><thead><tr>'+keys.map(x=>'<th>'+esc(x)+'</th>').join("")+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+keys.map(k=>'<td title="'+esc(r[k])+'">'+esc(r[k])+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>'}
async function section(name){sec=name;$("title").textContent=heads[name];$("notice").textContent="";document.querySelectorAll(".nav[data-section]").forEach(b=>b.classList.toggle("selected",b.dataset.section===name));
if(name==="overview"){try{var x=await api("overview?server="+server);$("content").innerHTML='<div class="stats">'+Object.entries(x.counts).map(([k,v])=>'<div class="card stat"><strong>'+esc(v)+'</strong><span>'+esc(k)+'</span></div>').join("")+'</div><div class="card"><h3>Blazz Russia VK Bot</h3><p>Администрирование игровых серверов и реальных бесед ВКонтакте. Все действия проверяются сервером.</p></div>'}catch(e){notice(e.message,false)}return}
$("content").textContent="Загрузка...";
try{var x=await api("data?section="+encodeURIComponent(name)+"&server="+server);$("content").innerHTML='<div class="forms">'+controls(name)+'</div><h3>Записи ('+x.rows.length+')</h3>'+table(x.rows);document.querySelectorAll("form[data-action]").forEach(f=>f.addEventListener("submit",save));}catch(e){$("content").textContent="";notice(e.message,false)}}
async function save(e){e.preventDefault();var f=e.currentTarget,btn=f.querySelector("button");var data=Object.fromEntries(new FormData(f).entries());data.type=f.dataset.action;data.server=server;btn.disabled=true;try{var x=await post("action",data);await section(sec);notice(x.message||"Сохранено",true)}catch(err){notice(err.message,false)}finally{btn.disabled=false}}
async function signedIn(){try{var x=await api("me");$("login").classList.add("hide");$("app").classList.remove("hide");$("me").textContent="VK ID "+x.id+" • уровень "+x.level;var sr=await api("servers");if(sr.rows&&sr.rows.length)$("server").innerHTML=sr.rows.map(x=>"<option value="+esc(x.id)+">"+esc(x.name)+"</option>").join("");await section("overview")}catch(e){$("login").classList.remove("hide");$("app").classList.add("hide")}}
$("start").onclick=async()=>{try{var x=await post("start");$("auth").classList.remove("hide");$("start").classList.add("hide");$("command").textContent="/panel "+x.code;$("copy").onclick=()=>navigator.clipboard.writeText("/panel "+x.code);var times=0;waitingTimer=setInterval(async()=>{try{var s=await post("poll",{id:x.id,browser:x.browser});if(s.ok){clearInterval(waitingTimer);if(!s.session)throw Error("Сервер не передал сессию");sessionStorage.setItem("blazz_panel_session",s.session);await signedIn()}else if(++times>195){clearInterval(waitingTimer);$("waiting").textContent="Срок кода истёк, обновите страницу"}}catch(e){clearInterval(waitingTimer);$("waiting").textContent=e.message}},3000)}catch(e){$("loginerr").textContent=e.message}};
document.querySelectorAll(".nav[data-section]").forEach(b=>b.onclick=()=>section(b.dataset.section));
$("server").onchange=e=>{server=Number(e.target.value)||1;section(sec)};
$("logout").onclick=async()=>{try{await post("logout")}catch{}sessionStorage.removeItem("blazz_panel_session");location.reload()};
signedIn();
})();
</script></body></html>
